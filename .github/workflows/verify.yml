name: Verify

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Java 21 modules
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pom.xml ]]; then
            scripts/build_progression.sh
            git diff --exit-code -- docs/ITEM_CATALOG.md docs/RECIPE_CATALOG.md
          else
            for module in source/*/pom.xml; do
              mvn -B -ntp -f "$module" clean verify
            done
          fi
